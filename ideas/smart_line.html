<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>导航实验 10 · 滑动式胶囊 · rev7</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b0e12;color:#e8ecf0;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
/* ---------- 页面轨道 ---------- */
#track{display:flex;height:100vh;width:100vw;will-change:transform}
.pg{flex:0 0 100vw;height:100%;position:relative;padding:120px 28px 0}
.pg .num{position:absolute;top:6px;right:22px;font-size:130px;font-weight:800;color:rgba(255,255,255,.045);line-height:1;pointer-events:none}
.pg h2{font-size:34px;margin-bottom:20px;letter-spacing:1px}
.pg h2.pop{animation:pgpop .45s cubic-bezier(.3,1.3,.4,1)}
@keyframes pgpop{from{opacity:0;transform:translateY(12px)}}
.row{height:56px;max-width:420px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);margin-bottom:12px}
#hint{position:fixed;top:22px;left:24px;font-size:12px;letter-spacing:2px;color:#57616b;font-weight:600;z-index:5;line-height:1.9}
/* ---------- 页名标签 ---------- */
#plabel{position:fixed;right:14px;width:50vw;bottom:calc(128px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;font-weight:700;letter-spacing:3px;color:#9aa3ad;z-index:9;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .3s;pointer-events:none}
#plabel.up{opacity:1;transform:none}
#plabel.flip{animation:flip .34s cubic-bezier(.3,1.3,.4,1)}
@keyframes flip{0%{opacity:1;transform:translateY(0)}45%{opacity:0;transform:translateY(-6px)}46%{transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
/* ---------- 滚筒 ---------- */
#roller{position:fixed;right:14px;bottom:calc(52px + env(safe-area-inset-bottom,0px));width:50vw;height:58px;border-radius:29px;background:rgba(15,20,26,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 34px rgba(0,0,0,.45);overflow:hidden;pointer-events:none;z-index:9;opacity:0;transform:translateY(16px) scale(.94);transition:opacity .22s,transform .34s cubic-bezier(.3,1.4,.4,1);-webkit-mask:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
#roller.up{opacity:1;transform:none}
#strip{position:absolute;left:0;top:0;height:100%;will-change:transform}
.picon{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;border:none;background:none;color:#57616b;cursor:default;padding:0;display:flex;align-items:center;justify-content:center;transition:background .18s,color .18s,box-shadow .25s}
.picon svg{width:19px;height:19px;display:block}
.picon.on{background:#fff;color:#0d1116;box-shadow:0 0 18px rgba(255,255,255,.4)}
.picon.tick svg{animation:ptk .3s cubic-bezier(.3,1.6,.4,1)}
@keyframes ptk{40%{transform:scale(1.35)}}
#ctr{position:absolute;left:50%;top:7px;bottom:7px;width:2px;margin-left:-1px;border-radius:1px;background:rgba(255,255,255,.14);z-index:2}
#ctr.tick{animation:ctk .28s}
@keyframes ctk{30%{background:rgba(255,255,255,.95);box-shadow:0 0 10px rgba(255,255,255,.7)}}
/* ---------- 快捷操作弧 ---------- */
#quick{position:fixed;inset:0;pointer-events:none;z-index:9}
.qicon{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(15,20,26,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);color:#57616b;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(16px) scale(.55);transition:opacity .22s,transform .36s cubic-bezier(.3,1.5,.4,1),background .18s,color .18s,box-shadow .25s}
#quick.up .qicon{opacity:1;transform:none}
.qicon svg{width:19px;height:19px;display:block}
.qicon.on{background:#fff;color:#0d1116;box-shadow:0 0 18px rgba(255,255,255,.45),0 10px 24px rgba(0,0,0,.5)}
.qicon.on svg{animation:ptk .3s cubic-bezier(.3,1.6,.4,1)}
#quick.out{opacity:0;transition:opacity .3s}
#quick.out .qicon{transform:translateY(14px) scale(.75)}
.ripple{position:fixed;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 16px rgba(255,255,255,.4),inset 0 0 8px rgba(255,255,255,.3);pointer-events:none;z-index:12;animation:rip .65s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{from{transform:scale(.45);opacity:1}to{transform:scale(2.5);opacity:0}}
/* ---------- 胶囊：三形态 ---------- */
#cap{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:50vw;height:10px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid transparent;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);touch-action:none;cursor:grab;z-index:10;transition:width .38s cubic-bezier(.3,1.1,.3,1),height .32s cubic-bezier(.3,1.2,.4,1),background .22s,box-shadow .28s,border-color .28s}
#cap.pressed{background:rgba(255,255,255,.22);cursor:grabbing}
#cap::before{content:'';position:absolute;left:-12px;right:-12px;top:-30px;bottom:-12px}
#cap.search::before{top:-8px}
#cap .thumb{position:absolute;top:0;bottom:0;left:0;width:24%;border-radius:999px;pointer-events:none;will-change:transform;background:rgba(255,255,255,.42);box-shadow:inset 0 1px 1px rgba(255,255,255,.22);transition:background .16s,box-shadow .16s,opacity .18s}
#cap.pressed .thumb{background:rgba(13,17,22,.94);box-shadow:inset 0 0 0 1.25px rgba(255,255,255,.4),0 2px 10px rgba(0,0,0,.55)}
#cap.search .thumb{opacity:0}
#cap.search{width:calc(100vw - 28px);height:44px;background:rgba(15,20,26,.9);border-color:rgba(255,255,255,.1);box-shadow:0 14px 38px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);cursor:text}
#cap.search.pressed{background:rgba(24,31,39,.95)}
#cap .sbox{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 18px 0 16px;opacity:0;pointer-events:none;transition:opacity .22s .1s}
#cap.search .sbox{opacity:1;pointer-events:auto}
#cap .sbox>svg{width:17px;height:17px;color:#6b7680;flex:none;transition:color .2s}
#cap.input .sbox>svg{color:#7aa2ff}
#cap .sbox input{flex:1;min-width:0;background:none;border:none;outline:none;color:#e8ecf0;font-family:inherit;font-size:16px;letter-spacing:.5px;caret-color:#7aa2ff;user-select:text;-webkit-user-select:text;touch-action:manipulation}
#cap .sbox input::placeholder{color:#5a646e}
/* ---------- 最近搜索：搜索框上方的次级胶囊流 ---------- */
#cap .hist{position:absolute;left:2px;right:2px;bottom:calc(100% + 12px);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;opacity:0;transform:translateY(14px) scale(.97);pointer-events:none;transition:opacity .25s,transform .34s cubic-bezier(.3,1.2,.4,1)}
#cap.search .hist{opacity:1;transform:none;pointer-events:auto;transition-delay:.08s}
.hchip{max-width:220px;height:28px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.05);color:rgba(232,236,240,.52);font-family:inherit;font-size:12px;letter-spacing:.5px;line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;opacity:0;transform:translateY(8px) scale(.85);transition:opacity .26s,transform .34s cubic-bezier(.3,1.4,.4,1),background .15s,color .15s,border-color .15s}
#cap.search .hchip{opacity:1;transform:none}
#cap.search .hchip:nth-child(1){transition-delay:.10s}
#cap.search .hchip:nth-child(2){transition-delay:.14s}
#cap.search .hchip:nth-child(3){transition-delay:.18s}
#cap.search .hchip:nth-child(4){transition-delay:.22s}
#cap.search .hchip:nth-child(5){transition-delay:.26s}
#cap.search .hchip:nth-child(6){transition-delay:.30s}
#cap.search .hchip:nth-child(7){transition-delay:.34s}
#cap.search .hchip:nth-child(8){transition-delay:.38s}
.hchip:active,.hchip.hit{background:rgba(255,255,255,.9);color:#0d1116;border-color:transparent}
/* ---------- 倒计时边框 ---------- */
#cap .fuse{position:absolute;left:-4px;top:-4px;width:calc(100% + 8px);height:calc(100% + 8px);overflow:visible;opacity:0;transition:opacity .3s .32s;pointer-events:none;z-index:3}
#cap.search:not(.input) .fuse{opacity:1}
#cap .fuse path{fill:none;stroke:rgba(122,162,255,.95);stroke-width:7;stroke-linecap:round}
</style>
</head>
<body>

<div id="hint">10 rev7 · 长按 0.45s ＝ 搜索框＋最近搜索<br>横滑＝翻页 · 竖直上甩＝快捷 · 双击＝直达<br>慢拖精调 · 快甩穿越 · 点历史项直接带入输入<br>搜索中：点空白恢复 · 边框烧完自动收</div>

<div id="track"></div>

<div id="plabel">聊天</div>
<div id="roller"><div id="strip"></div><div id="ctr"></div></div>

<div id="cap">
  <div class="hist" id="hist"></div>
  <div class="thumb"></div>
  <div class="sbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <input id="sinput" type="text" placeholder="搜索页面、联系人、文件…" autocomplete="off" enterkeyhint="search">
  </div>
  <svg class="fuse" id="fuse" preserveAspectRatio="none" aria-hidden="true"><path id="fpT" pathLength="100"/><path id="fpB" pathLength="100"/></svg>
</div>

<script>
'use strict';
const cap=document.getElementById('cap'),track=document.getElementById('track'),
      roller=document.getElementById('roller'),strip=document.getElementById('strip'),
      plabel=document.getElementById('plabel'),ctr=document.getElementById('ctr'),
      thumb=cap.querySelector('.thumb'),sinput=document.getElementById('sinput'),
      hist=document.getElementById('hist'),
      fuse=document.getElementById('fuse'),fpT=document.getElementById('fpT'),fpB=document.getElementById('fpB');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const N=10,PITCH=54,HOLD=450;

const W_=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const names=['聊天','通讯录','动态','收藏','设置','相机','游戏','钱包','音乐','文件'];
const icons=[
W_('<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>'),
W_('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),
W_('<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>'),
W_('<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'),
W_('<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>'),
W_('<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>'),
W_('<rect x="2" y="7" width="20" height="12" rx="6"/><line x1="7" y1="11" x2="7" y2="15"/><line x1="5" y1="13" x2="9" y2="13"/><circle cx="16" cy="12" r="1"/><circle cx="18.5" cy="14.5" r="1"/>'),
W_('<rect x="1" y="4" width="22" height="16" rx="3"/><line x1="1" y1="10" x2="23" y2="10"/>'),
W_('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'),
W_('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>')
];
const QIC=[
W_('<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3z"/><path d="M14 14v7M21 14v7"/>'),
W_('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
W_('<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/>')
];
/* 演示用最近搜索（长短混排：短的同行挤，长的出省略号） */
const HISTORY=['周报模板','会议室预订','报销流程','张伟','五月的旅行照片','跨部门项目同步会议纪要归档','密码生成器推荐'];

/* ---------- 生成页面与滚筒 ---------- */
names.forEach(function(n,i){
  const s=document.createElement('section');
  s.className='pg';
  s.innerHTML='<div class="num">'+String(i+1).padStart(2,'0')+'</div><h2>'+n+'</h2>';
  for(let r=0;r<5;r++){const d=document.createElement('div');d.className='row';s.appendChild(d)}
  track.appendChild(s);
});
const picons=names.map(function(n,i){
  const b=document.createElement('div');
  b.className='picon'+(i===0?' on':'');
  b.style.left=(i*PITCH-20)+'px';
  b.innerHTML=icons[i];
  strip.appendChild(b);
  return b;
});

/* ---------- 最近搜索胶囊 ---------- */
HISTORY.forEach(function(txt){
  const c=document.createElement('button');
  c.type='button';c.className='hchip';c.textContent=txt;
  c.addEventListener('click',function(e){
    e.stopPropagation();
    c.classList.add('hit');                       // 点中反馈：闪白
    setTimeout(function(){c.classList.remove('hit')},180);
    sinput.value=txt;
    try{sinput.focus({preventScroll:true})}catch(_){try{sinput.focus()}catch(_){}}  // 直接进入输入态
  });
  hist.appendChild(c);
});

/* ---------- 状态 ---------- */
let W=innerWidth,RW=roller.clientWidth;
let p=0,v=0,tgt=0,mode='idle',act=0,g=null,sinkT=null;
let searchMode='off';
let tapT=0,fuseT0=0,pressTimer=null,holdOpened=false,q=null;

const geo=()=>{const w=W/2,L=w*.24;return{left:W-14-w,w:w,L:L}};
const xToP=x=>{const G=geo(),c=clamp(x-G.left,G.L/2,G.w-G.L/2);return (c-G.L/2)/(G.w-G.L)*(N-1)};
const pToC=pp=>{const G=geo();return G.L/2+clamp(pp,0,N-1)/(N-1)*(G.w-G.L)};
const snapT=pp=>Math.round(clamp(pp,0,N-1));
const rub=pp=>pp<0?-Math.min(-pp*.3,.35):pp>N-1?N-1+Math.min((pp-(N-1))*.3,.35):pp;

/* ---------- 非线性增益（已验收，未动） ---------- */
const gainOf=function(v){
  const t=Math.min(Math.abs(v)/1500,1);
  const s=t*t*(3-2*t);
  return .38+4.12*s;
};

function sink(delay){clearTimeout(sinkT);sinkT=setTimeout(function(){roller.classList.remove('up');plabel.classList.remove('up')},delay)}

function setActive(i){
  picons.forEach(function(b,j){b.classList.toggle('on',j===i)});
  plabel.textContent=names[i];
  plabel.classList.remove('flip');void plabel.offsetWidth;plabel.classList.add('flip');
  ctr.classList.remove('tick');void ctr.offsetWidth;ctr.classList.add('tick');
  const pc=picons[i];pc.classList.remove('tick');void pc.offsetWidth;pc.classList.add('tick');
  if(navigator.vibrate){try{navigator.vibrate(6)}catch(_){}}
}

function render(){
  const pv=rub(p);
  strip.style.transform='translateX('+(RW/2-pv*PITCH)+'px)';
  track.style.transform='translateX('+(-pv*W)+'px)';
  thumb.style.transform='translateX('+(pToC(p)-geo().L/2)+'px)';
  const ai=snapT(p);
  if(ai!==act){act=ai;setActive(ai)}
}
function settleDone(){
  const h=track.children[act].querySelector('h2');
  if(h){h.classList.remove('pop');void h.offsetWidth;h.classList.add('pop')}
  sink(650);
}

/* ---------- 倒计时边框 ---------- */
function buildFuse(){
  const W2=Math.max(120,W-20),H2=52,sw=7,rr=H2/2-sw/2;
  const xR=W2-sw/2,xL=sw/2,yT=sw/2,yB=H2-sw/2,yM=H2/2;
  fuse.setAttribute('viewBox','0 0 '+W2+' '+H2);
  fpT.setAttribute('d','M '+xR+' '+yM+' A '+rr+' '+rr+' 0 0 0 '+(xR-rr)+' '+yT+' L '+(xL+rr)+' '+yT+' A '+rr+' '+rr+' 0 0 0 '+xL+' '+yM);
  fpB.setAttribute('d','M '+xR+' '+yM+' A '+rr+' '+rr+' 0 0 1 '+(xR-rr)+' '+yB+' L '+(xL+rr)+' '+yB+' A '+rr+' '+rr+' 0 0 1 '+xL+' '+yM);
}
function setFuse(P){
  fpT.setAttribute('stroke-dasharray',P+' 100');
  fpB.setAttribute('stroke-dasharray',P+' 100');
}

/* ---------- 搜索三态 ---------- */
function openSearch(){
  searchMode='open';
  cap.classList.add('search');
  clearTimeout(sinkT);roller.classList.remove('up');plabel.classList.remove('up');
  buildFuse();setFuse(100);
  fuseT0=performance.now()+650;
  try{sinput.blur()}catch(_){}
  if(navigator.vibrate){try{navigator.vibrate(12)}catch(_){}}
}
function closeSearch(){
  searchMode='off';
  cap.classList.remove('search','input');
  cap.style.bottom='';
  fuseT0=0;
  try{sinput.blur()}catch(_){}
}

sinput.addEventListener('focus',function(){searchMode='input';cap.classList.add('input')});
sinput.addEventListener('blur',function(){
  setTimeout(function(){if(searchMode==='input'&&document.activeElement!==sinput)closeSearch()},100);
});
sinput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();closeSearch()}});

document.addEventListener('pointerdown',function(e){
  if(searchMode!=='off'&&!cap.contains(e.target))closeSearch();
},true);

cap.addEventListener('contextmenu',function(e){if(searchMode!=='input')e.preventDefault()});

if(window.visualViewport){
  window.visualViewport.addEventListener('resize',function(){
    if(searchMode==='input'){
      const kb=Math.max(0,innerHeight-window.visualViewport.height);
      cap.style.bottom='calc(16px + env(safe-area-inset-bottom,0px) + '+Math.round(kb)+'px)';
    }
  });
}

/* ---------- 快捷操作弧 ---------- */
function openQuick(){
  const G=geo(),cx=G.left+G.w/2,cy=innerHeight-21,R=108,angs=[205,258,311];
  const wrap=document.createElement('div');wrap.id='quick';
  const xs=[];
  const els=angs.map(function(a,k){
    const rad=a*Math.PI/180,x=cx+R*Math.cos(rad),y=cy+R*Math.sin(rad);
    xs.push(x);
    const d=document.createElement('div');
    d.className='qicon';
    d.style.left=x+'px';d.style.top=y+'px';
    d.style.transitionDelay=(k===2?'0s':k===1?'.05s':'.1s');
    d.innerHTML=QIC[k];
    wrap.appendChild(d);return d;
  });
  document.body.appendChild(wrap);
  requestAnimationFrame(function(){requestAnimationFrame(function(){wrap.classList.add('up')})});
  q={wrap:wrap,els:els,sel:1,x0:(xs[0]+xs[1])/2,x1:(xs[1]+xs[2])/2};
  updateQuickSel();
}
function updateQuickSel(){q.els.forEach(function(el,i){el.classList.toggle('on',i===q.sel)})}
function closeQuick(fire){
  if(!q)return;
  const el=q.els[q.sel],wrap=q.wrap;q=null;
  if(fire){
    const r=el.getBoundingClientRect();
    const d=document.createElement('i');
    d.className='ripple';
    d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2)+'px';
    document.body.appendChild(d);
    setTimeout(function(){d.remove()},750);
  }
  wrap.classList.add('out');
  setTimeout(function(){wrap.remove()},330);
}

/* ---------- 物理循环 ---------- */
let last=performance.now();
function loop(now){
  const dt=clamp((now-last)/1000,.001,.05);last=now;
  if(mode==='fling'){
    v*=Math.exp(-3.1*dt);p+=v*dt;
    if(p<0){p=0;v=0;mode='snap';tgt=0}
    else if(p>N-1){p=N-1;v=0;mode='snap';tgt=N-1}
    else if(Math.abs(v)<.9){mode='snap';tgt=snapT(p)}
  }else if(mode==='snap'){
    v+=((tgt-p)*240-26*v)*dt;p+=v*dt;
    if(Math.abs(tgt-p)<.004&&Math.abs(v)<.08){p=tgt;v=0;mode='idle';settleDone()}
  }
  if(searchMode==='open'&&fuseT0){
    const el=performance.now()-fuseT0;
    if(el>=0){
      const P=Math.max(0,100-el/20);
      if(P>0)setFuse(P);
      if(P<=0)closeSearch();
    }
  }
  render();
  requestAnimationFrame(loop);
}

/* ---------- 方向锁定 ---------- */
function lockPage(e){
  g.moved=true;g.q=false;
  clearTimeout(pressTimer);
  clearTimeout(sinkT);roller.classList.add('up');plabel.classList.add('up');
  g.p0=p;g.acc=0;g.lx=e.clientX;g.lt=performance.now();g.sv=0;g.vx=0;
}
function lockQuick(e){
  g.moved=true;g.q=true;
  clearTimeout(pressTimer);
  cap.classList.remove('pressed');
  openQuick();
}

cap.addEventListener('pointerdown',function(e){
  if(searchMode!=='off'){holdOpened=false;return}
  if(g)return;
  e.preventDefault();
  try{cap.setPointerCapture(e.pointerId)}catch(_){}
  cap.classList.add('pressed');
  const now=performance.now();
  const dbl=!!tapT&&now-tapT<300;
  tapT=0;
  mode='idle';v=0;
  g={id:e.pointerId,x0:e.clientX,y0:e.clientY,lx:e.clientX,p0:p,lp:p,lt:now,vx:0,sv:0,acc:0,moved:false,dbl:dbl,q:false};
  clearTimeout(pressTimer);
  pressTimer=setTimeout(function(){
    if(g&&!g.moved){
      g=null;
      cap.classList.remove('pressed');
      holdOpened=true;
      openSearch();
    }
  },HOLD);
});

window.addEventListener('pointermove',function(e){
  if(!g||e.pointerId!==g.id)return;
  if(!g.moved){
    const dx=e.clientX-g.x0,dy=e.clientY-g.y0,adx=Math.abs(dx),ady=Math.abs(dy);
    if(adx>8&&adx>ady*1.1){lockPage(e)}
    else if(dy<-16&&ady>adx*2){lockQuick(e)}
    else if(Math.hypot(dx,dy)>28){
      if(adx>ady)lockPage(e);
      else if(dy<0)lockQuick(e);
      else lockPage(e);
    }
    else return;
  }
  if(g.q){
    if(q){
      const ns=e.clientX<q.x0?0:e.clientX>q.x1?2:1;
      if(ns!==q.sel){q.sel=ns;updateQuickSel();if(navigator.vibrate){try{navigator.vibrate(6)}catch(_){}}}
    }
    return;
  }
  mode='drag';
  const now=performance.now();
  let dts=(now-g.lt)/1000;g.lt=now;
  if(dts>.12){g.sv*=Math.exp(-dts/.09);dts=.008}
  dts=Math.max(dts,.008);
  const dxi=e.clientX-g.lx;g.lx=e.clientX;
  g.sv+=(dxi/dts-g.sv)*(1-Math.exp(-dts/.09));
  const gain=gainOf(g.sv);
  g.acc-=dxi*gain/PITCH;
  p=g.p0+g.acc;
  g.vx=.72*g.vx+.28*(p-g.lp)/dts;g.lp=p;
  render();
});

function release(e,cancelled){
  if(!g||e.pointerId!==g.id)return;
  clearTimeout(pressTimer);
  const moved=g.moved,vx=g.vx,dbl=g.dbl,isQ=g.q;g=null;
  cap.classList.remove('pressed');
  if(isQ){closeQuick(!cancelled);return}
  if(!moved){
    if(cancelled)return;
    if(dbl){mode='snap';v=0;tgt=snapT(xToP(e.clientX))}
    else tapT=performance.now();
    return;
  }
  if(!cancelled&&Math.abs(vx)>1.15){mode='fling';v=clamp(vx,-20,20)}
  else{mode='snap';v=0;tgt=snapT(p)}
}
window.addEventListener('pointerup',function(e){release(e,false)});
window.addEventListener('pointercancel',function(e){release(e,true)});

cap.addEventListener('click',function(){
  if(searchMode==='open'&&!holdOpened){
    try{sinput.focus({preventScroll:true})}catch(_){try{sinput.focus()}catch(_){}}
  }
});

window.addEventListener('resize',function(){
  W=innerWidth;RW=roller.clientWidth;
  buildFuse();
  if(q)closeQuick(false);
  render();
});

buildFuse();
render();
requestAnimationFrame(loop);
</script>
</body>
