<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>实验 12 · 三条 · AI 对话 · rev6</title>
<style>
:root{--acc:#7aa2ff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0b0e12;color:#e8ecf0;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
/* ---------- 页面 ---------- */
#page{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:84px 28px 140px;will-change:transform}
.pignum{font-size:120px;font-weight:800;color:rgba(255,255,255,.05);line-height:1;pointer-events:none}
#page h2{font-size:30px;margin:6px 0 14px;letter-spacing:1px}
.note{font-size:13px;line-height:1.9;color:#57616b;margin-bottom:26px}
.note b{color:var(--acc);font-weight:600;transition:color .3s}
.row{height:56px;max-width:420px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);margin-bottom:12px;transition:opacity .22s,transform .22s}
.row.pop{animation:rowin .32s cubic-bezier(.3,1.3,.4,1)}
@keyframes rowin{from{opacity:0;transform:translateY(10px) scale(.97)}}
.row.out{opacity:0;transform:translateY(-6px)}
#hint{position:fixed;top:18px;left:24px;font-size:12px;letter-spacing:2px;color:#57616b;font-weight:600;z-index:5;line-height:1.9;transition:opacity .4s;cursor:pointer}
/* ---------- 三条：底部一整行，间距统一 14px ---------- */
#cap{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:50vw;height:10px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,.1);pointer-events:none;z-index:10}
#hhandle{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:10px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,.1);touch-action:none;cursor:grab;z-index:31}
#hhandle.pressed{background:rgba(255,255,255,.24);cursor:grabbing}
#hhandle.hide{opacity:0;pointer-events:none}
/* AI 条：流动虹彩 + 光晕（宽 38vw-56px，与两侧恰好各隔 14px） */
#ai{position:fixed;left:calc(28px + 12vw);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:calc(38vw - 56px);height:10px;border-radius:999px;background:linear-gradient(110deg,#7aa2ff,#b48aff,#ff8ad0,#ffc46b,#6fd6a8,#5ec8e8,#7aa2ff);background-size:280% 100%;animation:aiflow 7s linear infinite;z-index:20;touch-action:none;cursor:pointer;transition:filter .2s}
#ai::before{content:'';position:absolute;left:0;right:0;top:-4px;bottom:-4px;border-radius:999px;background:linear-gradient(110deg,#7aa2ff,#b48aff,#ff8ad0,#ffc46b,#6fd6a8,#5ec8e8,#7aa2ff);background-size:280% 100%;animation:aiflow 7s linear infinite;filter:blur(7px);opacity:.55;transition:opacity .25s;z-index:-1}
#ai.pressed{filter:brightness(1.3)}
#ai.pressed::before{opacity:.95}
@keyframes aiflow{to{background-position:280% 0}}
/* ---------- 本页操作胶囊 ---------- */
#vmenu{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:10px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid transparent;box-shadow:inset 0 1px 1px rgba(255,255,255,.1);overflow:hidden;display:none;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;padding:0 0 12px;z-index:32;touch-action:none;transition:height .34s cubic-bezier(.3,1.2,.4,1),background .25s,border-color .25s,box-shadow .3s}
#vmenu.on{display:flex}
#vmenu.up{height:var(--mh);background:rgba(15,20,26,.92);border-color:rgba(255,255,255,.1);box-shadow:0 14px 38px rgba(0,0,0,.55)}
#vmenu.deny{animation:deny .3s}
@keyframes deny{25%{transform:translateX(3px)}75%{transform:translateX(-3px)}}
.abtn{width:var(--bd);height:var(--bd);border-radius:50%;flex:none;border:none;background:#fff;color:#0d1116;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(255,255,255,.4);opacity:0;transform:translateY(12px) scale(.6);transition:opacity .2s,transform .3s cubic-bezier(.3,1.4,.4,1);cursor:pointer;padding:0}
#vmenu.up .abtn{opacity:1;transform:none}
#vmenu.up .abtn:nth-child(1){transition-delay:.03s}
#vmenu.up .abtn:nth-child(2){transition-delay:.07s}
#vmenu.up .abtn:nth-child(3){transition-delay:.11s}
.abtn:active{transform:scale(.88)!important}
.abtn svg{width:46%;height:46%;display:block}
#mscrim{position:fixed;inset:0;background:transparent;display:none;z-index:28}
#mscrim.on{display:block}
/* ---------- AI 对话框：大圆角矩形，不自动收起 ---------- */
#aiscrim{position:fixed;inset:0;background:transparent;display:none;z-index:27}
#aiscrim.on{display:block}
#aidlg{position:fixed;left:14px;right:14px;bottom:calc(38px + env(safe-area-inset-bottom,0px));height:min(52vh,360px);border-radius:22px;background:rgba(15,20,26,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;z-index:33;opacity:0;transform:translateY(20px) scale(.96);pointer-events:none;transition:opacity .24s,transform .32s cubic-bezier(.3,1.2,.4,1)}
#aidlg.on{opacity:1;transform:none;pointer-events:auto}
.amsgs{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:flex;flex-direction:column;gap:8px;padding:16px 14px 8px}
.amsg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.5;width:-moz-fit-content;width:fit-content;word-break:break-word}
.amsg.ai{align-self:flex-start;background:#1c242d;color:#dfe4ea;border-bottom-left-radius:6px}
.amsg.me{align-self:flex-end;background:var(--acc);color:#0d1116;border-bottom-right-radius:6px;transition:background .3s}
.amsg.new{animation:abin .3s cubic-bezier(.3,1.3,.4,1)}
@keyframes abin{from{opacity:0;transform:translateY(8px) scale(.96)}}
.amsg .cur{display:inline-block;width:2px;height:1em;background:var(--acc);vertical-align:-2px;margin-left:2px;animation:blinkc .8s steps(1) infinite}
@keyframes blinkc{50%{opacity:0}}
.think{display:flex;gap:4px;padding:12px 13px}
.think i{width:5px;height:5px;border-radius:50%;background:#6b7680;animation:tp 1.1s infinite}
.think i:nth-child(2){animation-delay:.18s}
.think i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.airow{display:flex;gap:10px;padding:10px 12px 12px;align-items:center;border-top:1px solid rgba(255,255,255,.06)}
#aiinput{flex:1;min-width:0;height:40px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05);border-radius:20px;padding:0 16px;color:#e8ecf0;font-family:inherit;font-size:15px;outline:none;caret-color:var(--acc);user-select:text;-webkit-user-select:text;touch-action:manipulation}
#aiinput::placeholder{color:#5a646e}
#aisend{width:36px;height:36px;border-radius:50%;border:none;background:#fff;color:#0d1116;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(255,255,255,.4);flex:none;cursor:pointer;transition:opacity .2s,transform .25s cubic-bezier(.3,1.4,.4,1);padding:0}
#aisend svg{width:16px;height:16px;display:block}
#aisend:active{transform:scale(.86)}
#aisend.dis{opacity:.3;pointer-events:none}
/* ---------- 触发光圈 ---------- */
.ripple{position:fixed;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 16px rgba(255,255,255,.4),inset 0 0 8px rgba(255,255,255,.3);pointer-events:none;z-index:40;animation:rip .65s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{from{transform:scale(.45);opacity:1}to{transform:scale(2.5);opacity:0}}
/* ---------- 抽屉与遮罩 ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.44);opacity:0;pointer-events:none;z-index:29}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(78vw,340px);background:rgba(17,22,29,.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid rgba(255,255,255,.07);box-shadow:24px 0 60px rgba(0,0,0,.45);border-radius:0 22px 22px 0;z-index:30;transform:translateX(-102%);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(26px + env(safe-area-inset-top,0px)) 22px calc(70px + env(safe-area-inset-bottom,0px))}
#drawer.anim{transition:transform .42s cubic-bezier(.3,1.1,.3,1)}
#scrim.anim{transition:opacity .34s ease}
#hhandle.anim{transition:left .42s cubic-bezier(.3,1.1,.3,1)}
.dava{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#1c242d);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#0d1116;transition:background .3s}
.dname{font-size:17px;font-weight:600;letter-spacing:1px;margin-top:14px}
.dsub{font-size:12px;color:#57616b;margin-top:3px}
.dbar{width:42px;height:2px;border-radius:1px;background:var(--acc);margin:18px 0 2px;transition:background .3s}
.dh{font-size:11px;letter-spacing:2px;color:#57616b;font-weight:700;margin:22px 0 12px}
.swr{display:flex;gap:13px}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;position:relative;transition:transform .2s}
.swatch:active{transform:scale(.82)}
.swatch.on::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--sw)}
.drow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:14px;color:#c9d0d8}
.sw2{width:38px;height:22px;border-radius:11px;background:rgba(255,255,255,.12);position:relative;transition:background .25s;flex:none}
.sw2 i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.4,1)}
.sw2.on{background:var(--acc)}
.sw2.on i{transform:translateX(16px)}
.rec{display:flex;gap:10px;padding:9px 0;font-size:13px;color:#6b7680;align-items:center}
.rec.cur{color:#dfe4ea}
.rec i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.15);flex:none;transition:background .3s,box-shadow .3s}
.rec.cur i{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.dver{margin-top:28px;font-size:11px;color:#57616b;letter-spacing:1px}
</style>
</head>
<body>

<div id="hint">12 · 三条 · rev6<br>左＝把手（单击本页操作 / 右拖侧边栏）<br>中＝AI 条：长按呼出对话框（点外部收起）<br>试试对它说：换个颜色 / 加一行 / 清空<br>（点我收起说明）</div>

<div id="page">
  <div class="pignum">12</div>
  <h2>三条</h2>
  <p class="note">底部现在住着三兄弟：<b>把手</b>（本页操作）、<b>AI 条</b>（彩色，会发光）、<b>导航条</b>（全局）。三条间距与屏幕留白全部是 14px，铺满一整行。<br>
  <b>长按</b>中间那条彩虹，对话框从底部升起——它不倒计时、不自动收起，点外部空白才走。<br>
  对话框里的住客不止会聊天：对它说「换个颜色」「加一行」「清空」，它是<b>真的会动手</b>的。</p>
  <div id="rows">
    <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
  </div>
</div>

<div id="cap"></div>

<div id="aiscrim"></div>
<div id="mscrim"></div>
<div id="scrim"></div>

<div id="aidlg">
  <div class="amsgs" id="amsgs"></div>
  <div class="airow">
    <input id="aiinput" type="text" placeholder="问点什么，或说：换个颜色" autocomplete="off" enterkeyhint="send">
    <button id="aisend" class="dis" type="button" aria-label="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
  </div>
</div>

<div id="drawer">
  <div class="dava">探</div>
  <div class="dname">实验者</div>
  <div class="dsub">探索模式 · 无目的地</div>
  <div class="dbar"></div>
  <div class="dh">强调色</div>
  <div class="swr" id="swr"></div>
  <div class="dh">手感</div>
  <div class="drow" id="hrow">震感反馈<span class="sw2 on" id="hsw"><i></i></span></div>
  <div class="dh">实验记录</div>
  <div id="recs"></div>
  <div class="dver">探索 · 第 12 号 · 仍无目的</div>
</div>

<div id="hhandle"></div>
<div id="ai"></div>
<div id="vmenu"></div>

<script>
'use strict';
/* ---------- 安全存储 + 安全 JSON ---------- */
const store={
  get(k){try{return window.localStorage.getItem(k)}catch(_){return null}},
  set(k,v){try{window.localStorage.setItem(k,v)}catch(_){}}
};
const jload=(s,d)=>{try{const v=JSON.parse(s);return Array.isArray(v)?v:d}catch(_){return d}};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const page=document.getElementById('page'),hint=document.getElementById('hint'),
      handle=document.getElementById('hhandle'),vmenu=document.getElementById('vmenu'),
      mscrim=document.getElementById('mscrim'),scrim=document.getElementById('scrim'),
      drawer=document.getElementById('drawer'),
      swr=document.getElementById('swr'),hsw=document.getElementById('hsw'),
      recs=document.getElementById('recs'),rows=document.getElementById('rows'),
      aibar=document.getElementById('ai'),aidlg=document.getElementById('aidlg'),
      aiscrim=document.getElementById('aiscrim'),amsgs=document.getElementById('amsgs'),
      aiinput=document.getElementById('aiinput'),aisend=document.getElementById('aisend');

/* ---------- 强调色 / 震感 ---------- */
const COLORS=[['蓝','#7aa2ff'],['紫','#b48aff'],['绿','#6fd6a8'],['琥珀','#ffc46b'],['珊瑚','#ff8a8a']];
let hapticsOn=store.get('exp_hap')!=='0';
let acc=store.get('exp_acc')||'#7aa2ff';
function applyAcc(c){
  acc=c;
  document.documentElement.style.setProperty('--acc',c);
  store.set('exp_acc',c);
  swr.querySelectorAll('.swatch').forEach(function(s){s.classList.toggle('on',s.dataset.c===c)});
}
COLORS.forEach(function(p){
  const s=document.createElement('div');
  s.className='swatch';s.dataset.c=p[1];
  s.style.background=p[1];s.style.setProperty('--sw',p[1]);
  s.addEventListener('click',function(e){e.stopPropagation();applyAcc(p[1]);vib(8)});
  swr.appendChild(s);
});
function vib(n){if(hapticsOn&&navigator.vibrate){try{navigator.vibrate(n)}catch(_){}}}
function renderHap(){hsw.classList.toggle('on',hapticsOn)}
hsw.parentElement.addEventListener('click',function(e){
  e.stopPropagation();
  hapticsOn=!hapticsOn;store.set('exp_hap',hapticsOn?'1':'0');
  renderHap();vib(10);
});
[['10','滑动式胶囊',0],['11','呼吸点与总览',0],['12','左侧把手',1]].forEach(function(r){
  const d=document.createElement('div');
  d.className='rec'+(r[2]?' cur':'');
  d.innerHTML='<i></i>'+r[0]+' · '+r[1];
  recs.appendChild(d);
});
applyAcc(acc);renderHap();
hint.addEventListener('click',function(){hint.style.opacity='0';hint.style.pointerEvents='none'});

/* ---------- 页面操作（供按钮和 AI 共用） ---------- */
const W_=p=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
function addPlaceholderRow(){
  if(rows.children.length>=12)return 0;
  const d=document.createElement('div');d.className='row pop';rows.appendChild(d);
  return rows.children.length;
}
function clearRows(){
  const kids=Array.from(rows.children);
  if(!kids.length)return 0;
  kids.forEach(function(r,i){setTimeout(function(){r.classList.add('out')},i*20)});
  setTimeout(function(){rows.innerHTML=''},kids.length*20+260);
  return kids.length;
}
const PAGE_ACTIONS=[
 {label:'换一个强调色',icon:W_('<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>'),
  fn:function(){applyAcc(COLORS[(COLORS.findIndex(function(p){return p[1]===acc})+1)%COLORS.length][1])}},
 {label:'加一行占位',icon:W_('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  fn:function(){if(!addPlaceholderRow()){vib(4);vmenu.classList.remove('deny');void vmenu.offsetWidth;vmenu.classList.add('deny')}}},
 {label:'清空占位行',icon:W_('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1.4 13.2a2 2 0 0 1-2 1.8H8.4a2 2 0 0 1-2-1.8L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>'),
  fn:function(){if(!clearRows())vib(4)}}
];
function fireRipple(x,y){
  const d=document.createElement('i');
  d.className='ripple';
  d.style.left=x+'px';d.style.top=y+'px';
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},750);
}

/* ---------- 几何 ---------- */
let W=innerWidth,THUMB_W=0,MENU_H=0;
const GAP=14;
const dw=()=>Math.min(Math.round(W*.78),340);
const dockX=()=>dw()+GAP;
function layout(){
  W=innerWidth;
  THUMB_W=Math.round(W*.12);                 /* 纯 12vw，与 CSS 里的 AI 条几何严格一致 */
  const BD=clamp(THUMB_W-12,32,42);
  MENU_H=BD*3+2*10+2*12;
  handle.style.width=THUMB_W+'px';
  vmenu.style.width=THUMB_W+'px';
  vmenu.style.setProperty('--mh',MENU_H+'px');
  vmenu.style.setProperty('--bd',BD+'px');
}

/* ---------- 操作胶囊按钮 ---------- */
PAGE_ACTIONS.forEach(function(a){
  const b=document.createElement('button');
  b.type='button';b.className='abtn';b.title=a.label;b.setAttribute('aria-label',a.label);
  b.innerHTML=a.icon;
  b.addEventListener('pointerdown',function(e){e.stopPropagation()});
  b.addEventListener('click',function(e){
    e.stopPropagation();
    const r=b.getBoundingClientRect();
    fireRipple(r.left+r.width/2,r.top+r.height/2);
    vib(8);a.fn();
  });
  vmenu.appendChild(b);
});

/* ---------- 状态：closed / menu / drawer / aidlg 互斥 ---------- */
let open=false,menuOpen=false,aiOpen=false,drag=null,closeTimer=null;

function openMenu(){
  if(menuOpen||open)return;
  closeAI();
  menuOpen=true;
  clearTimeout(closeTimer);
  mscrim.classList.add('on');
  handle.classList.add('hide');
  vmenu.classList.add('on');
  requestAnimationFrame(function(){requestAnimationFrame(function(){vmenu.classList.add('up')})});
  vib(10);
}
function closeMenu(){
  if(!menuOpen)return;
  menuOpen=false;
  mscrim.classList.remove('on');
  vmenu.classList.remove('up');
  closeTimer=setTimeout(function(){
    vmenu.classList.remove('on');
    handle.classList.remove('hide');
  },360);
}
mscrim.addEventListener('click',closeMenu);
let mtap=null;
vmenu.addEventListener('pointerdown',function(e){
  if(e.target.closest('.abtn'))return;
  mtap={x:e.clientX,y:e.clientY};
});
window.addEventListener('pointerup',function(e){
  if(!mtap)return;
  const m=mtap;mtap=null;
  if(Math.hypot(e.clientX-m.x,e.clientY-m.y)<8)closeMenu();
});

/* ---------- AI 对话框 ---------- */
let AICONV=jload(store.get('exp_aichat'),[]);
function saveConv(){
  if(AICONV.length>40)AICONV=AICONV.slice(-40);
  store.set('exp_aichat',JSON.stringify(AICONV));
}
function addMsg(who,text,anim){
  const m=document.createElement('div');
  m.className='amsg '+who+(anim?' new':'');
  m.textContent=text;
  amsgs.appendChild(m);
  amsgs.scrollTop=amsgs.scrollHeight;
  if(anim){AICONV.push({w:who,t:text});saveConv()}
  return m;
}
function aiText(t){
  if(/色|颜色/.test(t)){
    const nx=COLORS[(COLORS.findIndex(function(p){return p[1]===acc})+1)%COLORS.length];
    applyAcc(nx[1]);
    return '好，强调色换成了「'+nx[0]+'」。说「再换个颜色」还能继续换。';
  }
  if(/加/.test(t)&&/行|条/.test(t)){
    const n=addPlaceholderRow();
    return n?('加好了，现在页面上有 '+n+' 行占位。'):'行数到顶了（12 行），先清空一些吧。';
  }
  if(/清空|清掉|删/.test(t)){
    const n=clearRows();
    return n?('清掉了 '+n+' 行，干净了。'):'页面本来就是空的。';
  }
  const pool=['收到。','有意思，展开说说？','我在。','嗯——从设计角度看，它本来就可以不需要按钮。','记下了。还有别的吗？','在这个实验的世界观里，一切先为手感服务。'];
  return pool[Math.floor(Math.random()*pool.length)];
}
function aiRespond(userText){
  const th=document.createElement('div');
  th.className='amsg ai think new';
  th.innerHTML='<i></i><i></i><i></i>';
  amsgs.appendChild(th);
  amsgs.scrollTop=amsgs.scrollHeight;
  setTimeout(function(){
    th.remove();
    const text=aiText(userText);
    const b=document.createElement('div');
    b.className='amsg ai new';
    const cur=document.createElement('i');cur.className='cur';
    b.appendChild(cur);
    amsgs.appendChild(b);
    let i=0;
    (function tick(){
      if(i<text.length){
        cur.insertAdjacentText('beforebegin',text.charAt(i++));
        amsgs.scrollTop=amsgs.scrollHeight;
        setTimeout(tick,14+Math.random()*24);
      }else{
        cur.remove();
        AICONV.push({w:'ai',t:text});saveConv();
      }
    })();
  },700+Math.random()*600);
}
function sendAI(){
  const t=aiinput.value.trim();
  if(!t)return;
  aiinput.value='';
  aisend.classList.add('dis');
  addMsg('me',t,true);
  vib(6);
  aiRespond(t);
}
aiinput.addEventListener('input',function(){aisend.classList.toggle('dis',!aiinput.value.trim())});
aiinput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendAI()}});
aisend.addEventListener('pointerdown',function(e){e.stopPropagation()});
aisend.addEventListener('click',function(e){e.stopPropagation();sendAI()});

function fitAIKB(){
  if(!aiOpen)return;
  const vh=window.visualViewport?window.visualViewport.height:innerHeight;
  const kb=Math.max(0,innerHeight-vh);
  aidlg.style.bottom=(38+kb)+'px';
  aidlg.style.height=Math.min(360,Math.max(220,vh-38-14))+'px';
}
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitAIKB);

function openAI(){
  if(aiOpen)return;
  closeMenu();
  if(open)settle(0);
  aiOpen=true;
  aiscrim.classList.add('on');
  aidlg.classList.add('on');
  if(!amsgs.children.length){
    if(AICONV.length){AICONV.forEach(function(m){addMsg(m.w,m.t,false)})}
    else addMsg('ai','你好，我住在那条彩色小条里。可以试试对我说：换个颜色 / 加一行 / 清空——我是真的会动手。这个对话框不会自动收起，点外面才会走。',true);
  }
  amsgs.scrollTop=amsgs.scrollHeight;
  vib(14);
}
function closeAI(){
  if(!aiOpen)return;
  aiOpen=false;
  aiscrim.classList.remove('on');
  aidlg.classList.remove('on');
  aidlg.style.bottom='';
  aidlg.style.height='';
  try{aiinput.blur()}catch(_){}
}
aiscrim.addEventListener('click',closeAI);
aibar.addEventListener('contextmenu',function(e){e.preventDefault()});

/* AI 条：长按 450ms 呼出（已开＝收起）；单击静默预留 */
let aiHold=null;
aibar.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{aibar.setPointerCapture(e.pointerId)}catch(_){}
  aibar.classList.add('pressed');
  aiHold={pid:e.pointerId,x:e.clientX,y:e.clientY,fired:false,timer:0};
  aiHold.timer=setTimeout(function(){
    if(!aiHold)return;
    aiHold.fired=true;
    aiOpen?closeAI():openAI();
  },450);
});
window.addEventListener('pointermove',function(e){
  if(!aiHold||aiHold.fired||e.pointerId!==aiHold.pid)return;
  if(Math.hypot(e.clientX-aiHold.x,e.clientY-aiHold.y)>8){
    clearTimeout(aiHold.timer);aiHold=null;
    aibar.classList.remove('pressed');
  }
});
function aiUp(e,cancelled){
  if(!aiHold||e.pointerId!==aiHold.pid)return;
  clearTimeout(aiHold.timer);
  aiHold=null;                                 /* 单击：无动作，预留 */
  if(!cancelled)aibar.classList.remove('pressed');
  else aibar.classList.remove('pressed');
}
window.addEventListener('pointerup',aiUp);
window.addEventListener('pointercancel',function(e){aiUp(e,true)});

/* ---------- 把手 ↔ 抽屉滑轨 ---------- */
function apply(k){
  drawer.style.transform='translateX('+((k-1)*100)+'%)';
  scrim.style.opacity=(k*.44).toFixed(3);
  scrim.style.pointerEvents=k>.05?'auto':'none';
  handle.style.left=(14+k*(dockX()-14))+'px';
  page.style.transform='translateX('+(k*12)+'vw)';
}
function anim(on){[drawer,scrim,handle].forEach(function(el){el.classList.toggle('anim',on)})}
function settle(target){
  if(target===1&&aiOpen)closeAI();
  anim(true);
  open=target===1;
  apply(target);
  if(open)vib(12);
}
function startDrag(e,src){
  drag={pid:e.pointerId,x0:e.clientX,y0:e.clientY,lx:e.clientX,lt:performance.now(),
        vx:0,k0:open?1:0,moved:false,dead:false,src:src};
  anim(false);
  if(src==='h'){handle.classList.add('pressed');try{handle.setPointerCapture(e.pointerId)}catch(_){}}
  else{try{drawer.setPointerCapture(e.pointerId)}catch(_){}}
}
handle.addEventListener('pointerdown',function(e){e.preventDefault();startDrag(e,'h')});
drawer.addEventListener('pointerdown',function(e){
  if(!open)return;
  if(e.target.closest('.swatch,.drow,.sw2'))return;
  startDrag(e,'d');
});
window.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.pid)return;
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.moved&&!drag.dead){
    if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)*1.1){drag.moved=true}
    else if(Math.abs(dy)>8){drag.dead=true}
  }
  if(!drag.moved||drag.dead)return;
  const now=performance.now(),dts=Math.max(8,now-drag.lt);
  drag.vx=.7*drag.vx+.3*(e.clientX-drag.lx)/dts;
  drag.lx=e.clientX;drag.lt=now;
  apply(clamp(drag.k0+dx/dw(),0,1));
});
function endDrag(e,cancelled){
  if(!drag||e.pointerId!==drag.pid)return;
  const d=drag;drag=null;
  handle.classList.remove('pressed');
  if(d.dead||cancelled){settle(open?1:0);return}
  if(!d.moved){
    if(d.src==='h'){
      if(open)settle(0);
      else openMenu();
    }
    return;
  }
  const k=clamp(d.k0+(e.clientX-d.x0)/dw(),0,1);
  if(k>.5||d.vx>.35)settle(1);
  else settle(0);
}
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',function(e){endDrag(e,true)});
scrim.addEventListener('click',function(){settle(0)});

window.addEventListener('resize',function(){
  layout();
  anim(false);apply(open?1:0);
  fitAIKB();
});

layout();
apply(0);
</script>
</body>
</html>
